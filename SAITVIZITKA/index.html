<body>
<div id="root"></div>

<script type="text/babel" src="src/store.jsx"></script>
<script type="text/babel" src="src/variants/price-calculator.jsx"></script>
<script type="text/babel" src="src/variants/dark.jsx"></script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "#E89B3C"
}/*EDITMODE-END*/;

function App() {
  const [editMode, setEditMode] = React.useState(false);
  const [data, update] = useStore();
  const [tweaks, setTweaks] = React.useState(() => ({ ...TWEAK_DEFAULTS, accent: (typeof loadStore === "function" ? loadStore().accent : null) || TWEAK_DEFAULTS.accent }));

  // apply tweak accent to store only when user actively changes it in edit mode
  const isFirstMount = React.useRef(true);
  React.useEffect(() => {
    if (isFirstMount.current) { isFirstMount.current = false; return; }
    if (!editMode) return;
    if (tweaks.accent && tweaks.accent !== data.accent) {
      update(d => { d.accent = tweaks.accent; return d; });
    }
  }, [tweaks.accent]);

  React.useEffect(() => {
    const handler = (e) => {
      if (e.data?.type === "__activate_edit_mode") setEditMode(true);
      if (e.data?.type === "__deactivate_edit_mode") setEditMode(false);
    };
    window.addEventListener("message", handler);
    window.parent.postMessage({ type: "__edit_mode_available" }, "*");
    return () => window.removeEventListener("message", handler);
  }, []);

  const setTweak = (key, val) => {
    const next = { ...tweaks, [key]: val };
    setTweaks(next);
    window.parent.postMessage({ type: "__edit_mode_set_keys", edits: { [key]: val } }, "*");
  };

  const presets = [
    { n: "Amber",  c: "#E89B3C" },
    { n: "Blue",   c: "#4B7CF0" },
    { n: "Green",  c: "#5CBF7F" },
    { n: "Violet", c: "#9B6BE8" },
    { n: "Pink",   c: "#E86BA0" },
    { n: "Red",    c: "#E25C5C" },
    { n: "Cyan",   c: "#4BC4D8" },
    { n: "Lime",   c: "#A8D840" },
  ];

  return (
    <>
      <DarkSite />
      {editMode && (
        <div style={{ position: "fixed", right: 24, bottom: 24, width: 280, background: "#0F0F10", border: "1px solid #1F1E1B", borderRadius: 12, padding: 20, zIndex: 9999, fontFamily: '"Inter", sans-serif', color: "#E8E6E1", boxShadow: "0 12px 40px rgba(0,0,0,0.5)" }}>
          <div style={{ fontFamily: "Instrument Serif, serif", fontSize: 22, marginBottom: 4 }}>Tweaks</div>
          <div style={{ color: "#8B8982", fontSize: 12, marginBottom: 16 }}>Миттєва зміна акценту. Для повного редагування — <a href="admin.html" style={{ color: tweaks.accent }}>адмінка</a>.</div>
          <div style={{ fontFamily: "JetBrains Mono, monospace", fontSize: 10, color: "#5E5B54", letterSpacing: "0.1em", marginBottom: 8 }}>ACCENT</div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 6, marginBottom: 12 }}>
            {presets.map(p => (
              <button key={p.c} onClick={() => setTweak("accent", p.c)} title={p.n} style={{ height: 36, background: p.c, border: tweaks.accent === p.c ? "2px solid #E8E6E1" : "1px solid #1F1E1B", borderRadius: 6, cursor: "pointer" }} />
            ))}
          </div>
          <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
            <input type="color" value={tweaks.accent} onChange={e => setTweak("accent", e.target.value)} style={{ width: 40, height: 32, border: "1px solid #1F1E1B", borderRadius: 6, background: "transparent", cursor: "pointer" }} />
            <input value={tweaks.accent} onChange={e => setTweak("accent", e.target.value)} style={{ flex: 1, background: "#0B0B0C", border: "1px solid #1F1E1B", color: "#E8E6E1", padding: 8, fontSize: 12, borderRadius: 6, fontFamily: "JetBrains Mono, monospace" }} />
          </div>
        </div>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
