<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="system-ui,Segoe UI,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121218"/><stop offset="1" stop-color="#0A0A0D"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.22" r="0.6">
      <stop offset="0" stop-color="#E89B3C" stop-opacity="0.22"/><stop offset="1" stop-color="#E89B3C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F4B86A"/>
    </linearGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#FFFFFF" opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#dots)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>
  
        <g opacity="0.14" fill="#E89B3C">
          <rect x="1060" y="290" width="170" height="170" rx="20"/>
          <rect x="1250" y="290" width="170" height="80" rx="16"/>
          <rect x="1250" y="390" width="170" height="70" rx="16"/>
          <rect x="1060" y="480" width="360" height="120" rx="20"/>
        </g>

  <!-- top meta -->
  <g font-family="JetBrains Mono,Consolas,monospace">
    <circle cx="92" cy="96" r="7" fill="#E89B3C"/>
    <text x="116" y="103" font-size="26" letter-spacing="3" fill="#E89B3C">WEB</text>
    <text x="1520" y="103" font-size="26" letter-spacing="2" fill="#5C5C68" text-anchor="end">2025</text>
  </g>

  <!-- title -->
  <text x="88" y="650" font-size="118" font-weight="700" letter-spacing="-3" fill="url(#tg)">LocalGym</text>

  <!-- stack -->
  <text x="92" y="730" font-family="JetBrains Mono,Consolas,monospace" font-size="30" fill="#9A9AA6">React · Supabase · Stripe</text>

  <!-- metric chip -->
  <g>
    <rect x="88" y="790" width="324" height="70" rx="20" fill="#E89B3C" opacity="0.14"/>
    <rect x="88" y="790" width="324" height="70" rx="20" fill="none" stroke="#E89B3C" stroke-opacity="0.4"/>
    <text x="120" y="836" font-family="JetBrains Mono,Consolas,monospace" font-size="30" font-weight="600" fill="#E89B3C">180 активних</text>
  </g>

  <rect x="0.5" y="0.5" width="1599" height="999" rx="0" fill="none" stroke="#FFFFFF" stroke-opacity="0.06"/>
</svg>