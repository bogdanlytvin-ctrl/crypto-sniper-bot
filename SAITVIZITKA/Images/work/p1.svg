<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="system-ui,Segoe UI,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1420"/><stop offset="1" stop-color="#080C14"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.75" cy="0.2" r="0.55">
      <stop offset="0" stop-color="#E89B3C" stop-opacity="0.18"/><stop offset="1" stop-color="#E89B3C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F4B86A"/>
    </linearGradient>
    <pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#FFFFFF" opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#dots)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>

  <!-- WEB decoration: browser grid -->
  <g opacity="0.12" fill="none" stroke="#E89B3C" stroke-width="5">
    <rect x="1040" y="260" width="440" height="320" rx="20"/>
    <line x1="1040" y1="310" x2="1480" y2="310"/>
    <circle cx="1078" cy="286" r="10" fill="#E89B3C" stroke="none"/>
    <circle cx="1114" cy="286" r="10" fill="#E89B3C" stroke="none"/>
    <circle cx="1150" cy="286" r="10" fill="#E89B3C" stroke="none"/>
    <rect x="1068" y="334" width="180" height="16" rx="8" fill="#E89B3C" stroke="none" opacity="0.5"/>
    <rect x="1068" y="366" width="240" height="16" rx="8" fill="#E89B3C" stroke="none" opacity="0.3"/>
    <rect x="1068" y="398" width="200" height="16" rx="8" fill="#E89B3C" stroke="none" opacity="0.3"/>
    <rect x="1068" y="430" width="160" height="16" rx="8" fill="#E89B3C" stroke="none" opacity="0.2"/>
  </g>

  <!-- top meta -->
  <g font-family="JetBrains Mono,Consolas,monospace">
    <circle cx="92" cy="96" r="8" fill="#E89B3C"/>
    <text x="118" y="103" font-size="26" letter-spacing="3" fill="#E89B3C" font-weight="600">WEB</text>
    <text x="1520" y="103" font-size="26" letter-spacing="2" fill="#4A5268" text-anchor="end">2026</text>
  </g>

  <!-- title -->
  <text x="88" y="650" font-size="118" font-weight="700" letter-spacing="-4" fill="url(#title)">Пекар B2B</text>

  <!-- tag -->
  <text x="92" y="712" font-family="JetBrains Mono,Consolas,monospace" font-size="28" fill="#7A8099" letter-spacing="0.5">Система замовлень для пекарні</text>

  <!-- stack -->
  <text x="92" y="762" font-family="JetBrains Mono,Consolas,monospace" font-size="26" fill="#545870">Next.js · TypeScript · Tailwind · Vercel</text>

  <!-- metric chip -->
  <rect x="88" y="808" width="380" height="64" rx="18" fill="#E89B3C" opacity="0.12"/>
  <rect x="88" y="808" width="380" height="64" rx="18" fill="none" stroke="#E89B3C" stroke-opacity="0.35" stroke-width="1.5"/>
  <text x="122" y="851" font-family="JetBrains Mono,Consolas,monospace" font-size="28" font-weight="600" fill="#E89B3C">vpekar.vercel.app</text>

  <rect x="0.5" y="0.5" width="1599" height="999" fill="none" stroke="#FFFFFF" stroke-opacity="0.05"/>
</svg>
