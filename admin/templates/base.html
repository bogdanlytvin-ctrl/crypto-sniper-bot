<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Crypto Sniper Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body{background:#0d1117;color:#e6edf3}
    .sidebar{min-height:100vh;background:#161b22;border-right:1px solid #30363d}
    .sidebar .brand{padding:20px;font-size:1.1rem;font-weight:700;color:#58a6ff;border-bottom:1px solid #30363d}
    .sidebar a{color:#8b949e;text-decoration:none;display:block;padding:10px 20px;font-size:.9rem}
    .sidebar a:hover,.sidebar a.active{color:#e6edf3;background:#21262d}
    main{padding:2rem}
    .card{background:#161b22;border:1px solid #30363d;color:#e6edf3}
    .card .text-muted{color:#8b949e!important}
    .table{color:#e6edf3}
    .table>:not(caption)>*>*{background:#161b22;border-color:#30363d}
    .table-hover tbody tr:hover>*{background:#21262d}
    .badge-strong{background:#1a7f37}
    .badge-buy{background:#9a6700}
    .badge-watch{background:#1158c7}
    .badge-skip{background:#6e7681}
    .stat-card{border-left:3px solid}
    .stat-blue{border-color:#58a6ff}
    .stat-green{border-color:#3fb950}
    .stat-orange{border-color:#d29922}
    .stat-purple{border-color:#a371f7}
    .stat-pink{border-color:#f778ba}
    .stat-cyan{border-color:#39c5cf}
    .stat-red{border-color:#f85149}
    .form-control,.form-select{background:#21262d;border:1px solid #30363d;color:#e6edf3}
    .form-control:focus,.form-select:focus{background:#21262d;border-color:#58a6ff;color:#e6edf3;box-shadow:none}
    .page-link{background:#161b22;border-color:#30363d;color:#58a6ff}
    .page-link:hover{background:#21262d;color:#e6edf3}
    .alert{background:#21262d;border-color:#30363d}
    code{color:#79c0ff}
  </style>
</head>
<body>
<div class="container-fluid g-0">
  <div class="row g-0">
    <nav class="col-md-2 sidebar">
      <div class="brand">🎯 Crypto Sniper</div>
      <a href="{{ url_for('dashboard') }}" class="{{ 'active' if request.endpoint=='dashboard' }}">📊 Dashboard</a>
      <a href="{{ url_for('users') }}"     class="{{ 'active' if request.endpoint=='users' }}">👥 Користувачі</a>
      <a href="{{ url_for('signals') }}"   class="{{ 'active' if request.endpoint=='signals' }}">📡 Сигнали</a>
      <a href="{{ url_for('trades') }}"    class="{{ 'active' if request.endpoint=='trades' }}">💱 Угоди</a>
      <a href="{{ url_for('positions') }}" class="{{ 'active' if request.endpoint=='positions' }}">📦 Позиції</a>
      <hr style="border-color:#30363d;margin:8px 20px">
      <a href="{{ url_for('logout') }}" style="color:#f85149">🚪 Вийти</a>
    </nav>
    <main class="col-md-10">
      {% with msgs = get_flashed_messages() %}{% if msgs %}{% for m in msgs %}
        <div class="alert alert-warning alert-dismissible">{{ m }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}{% endif %}{% endwith %}
      {% block content %}{% endblock %}
    </main>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
