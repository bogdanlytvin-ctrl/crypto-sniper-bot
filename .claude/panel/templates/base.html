<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Panel{% endblock %} · Agent System v3</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #080c14;
      --bg2:       #0d1421;
      --bg3:       #111927;
      --bg4:       #162033;
      --border:    #1e2d45;
      --border2:   #253550;
      --text:      #d4e0f0;
      --text2:     #7a92b0;
      --text3:     #4a6280;
      --purple:    #7c6fff;
      --green:     #00e5b0;
      --red:       #ff5b5b;
      --orange:    #ffb347;
      --teal:      #35d4c7;
      --lavender:  #b09fff;
      --pink:      #ff6eb0;
      --sidebar-w: 230px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.6;
      min-height: 100vh;
    }

    /* ── Sidebar ─────────────────────────────── */
    .sidebar {
      position: fixed;
      top: 0; left: 0;
      width: var(--sidebar-w);
      height: 100vh;
      background: var(--bg2);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 200;
      overflow: hidden;
    }

    .sidebar-logo {
      padding: 18px 20px 16px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-logo .logo-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo-icon {
      width: 34px; height: 34px;
      background: linear-gradient(135deg, var(--purple), var(--lavender));
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
    }
    .logo-text { font-weight: 800; font-size: 15px; color: var(--text); }
    .logo-sub  { font-size: 10px; color: var(--text3); margin-top: 1px; letter-spacing: 0.8px; text-transform: uppercase; }

    .sidebar-nav { flex: 1; padding: 10px 0; overflow-y: auto; }

    .nav-section-label {
      padding: 12px 20px 4px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text3);
      font-weight: 600;
    }

    .nav-link {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 20px;
      color: var(--text2);
      text-decoration: none;
      font-size: 13.5px;
      font-weight: 500;
      border-left: 2px solid transparent;
      transition: all 0.15s ease;
      position: relative;
    }
    .nav-link i { width: 16px; text-align: center; font-size: 13px; }
    .nav-link .badge {
      margin-left: auto;
      background: var(--bg4);
      color: var(--text2);
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 10px;
      font-weight: 600;
    }
    .nav-link .badge.red { background: rgba(255,91,91,.15); color: var(--red); }
    .nav-link:hover {
      color: var(--text);
      background: rgba(124,111,255,.06);
      border-left-color: rgba(124,111,255,.4);
    }
    .nav-link.active {
      color: var(--purple);
      background: rgba(124,111,255,.1);
      border-left-color: var(--purple);
    }
    .nav-link.active i { color: var(--purple); }

    .sidebar-footer {
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--text3);
    }
    .status-pulse {
      display: inline-block;
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--green);
      margin-right: 6px;
      animation: pulse 2.5s ease infinite;
    }
    @keyframes pulse {
      0%,100% { opacity: 1; box-shadow: 0 0 0 0 rgba(0,229,176,.4); }
      50% { opacity: .7; box-shadow: 0 0 0 4px rgba(0,229,176,0); }
    }

    /* ── Main ────────────────────────────────── */
    .main {
      margin-left: var(--sidebar-w);
      min-height: 100vh;
      padding: 28px 32px;
    }

    /* ── Page header ─────────────────────────── */
    .page-header { margin-bottom: 24px; }
    .page-header h1 {
      font-size: 22px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.3px;
    }
    .page-header p { color: var(--text2); font-size: 13px; margin-top: 3px; }

    /* ── Cards ───────────────────────────────── */
    .card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
    }
    .card:hover { border-color: var(--border2); }

    .card-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: .6px;
      margin-bottom: 14px;
    }

    /* ── Stat tiles ──────────────────────────── */
    .stat-tile {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px 20px;
    }
    .stat-tile .val {
      font-size: 34px;
      font-weight: 800;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .stat-tile .lbl {
      font-size: 11px;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: .6px;
      margin-top: 5px;
    }

    /* ── Badges ──────────────────────────────── */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 9px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .4px;
    }
    .badge-critical { background: rgba(255,91,91,.15); color: #ff5b5b; border: 1px solid rgba(255,91,91,.25); }
    .badge-high     { background: rgba(255,179,71,.12); color: #ffb347; border: 1px solid rgba(255,179,71,.25); }
    .badge-medium   { background: rgba(53,212,199,.1);  color: #35d4c7; border: 1px solid rgba(53,212,199,.2); }
    .badge-low      { background: rgba(0,229,176,.1);   color: #00e5b0; border: 1px solid rgba(0,229,176,.2); }
    .badge-open     { background: rgba(255,91,91,.1);   color: #ff5b5b; border: 1px solid rgba(255,91,91,.2); }
    .badge-fixed    { background: rgba(0,229,176,.1);   color: #00e5b0; border: 1px solid rgba(0,229,176,.2); }
    .badge-active   { background: rgba(0,229,176,.1);   color: #00e5b0; border: 1px solid rgba(0,229,176,.2); }

    /* ── Table ───────────────────────────────── */
    .data-table { width: 100%; border-collapse: collapse; }
    .data-table thead th {
      padding: 10px 14px;
      text-align: left;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .6px;
      color: var(--text3);
      border-bottom: 1px solid var(--border);
      background: var(--bg);
    }
    .data-table thead th:first-child { border-radius: 8px 0 0 0; }
    .data-table thead th:last-child  { border-radius: 0 8px 0 0; }
    .data-table tbody td {
      padding: 12px 14px;
      border-bottom: 1px solid rgba(30,45,69,.6);
      vertical-align: middle;
      font-size: 13px;
    }
    .data-table tbody tr:last-child td { border-bottom: none; }
    .data-table tbody tr:hover td { background: rgba(124,111,255,.03); }

    /* ── Code / mono ─────────────────────────── */
    code, .mono {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
    }
    code {
      background: var(--bg4);
      color: #79c7ff;
      padding: 2px 6px;
      border-radius: 5px;
    }
    pre {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      overflow-x: auto;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12.5px;
      line-height: 1.7;
      color: var(--text2);
    }

    /* ── Buttons ─────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: all .15s;
    }
    .btn-primary { background: var(--purple); color: #fff; }
    .btn-primary:hover { background: #6a5ef0; color: #fff; }
    .btn-success { background: rgba(0,229,176,.15); color: var(--green); border: 1px solid rgba(0,229,176,.3); }
    .btn-success:hover { background: rgba(0,229,176,.25); }
    .btn-ghost { background: var(--bg4); color: var(--text2); border: 1px solid var(--border); }
    .btn-ghost:hover { color: var(--text); border-color: var(--border2); }
    .btn-sm { padding: 4px 10px; font-size: 12px; }
    .btn-danger { background: rgba(255,91,91,.15); color: var(--red); border: 1px solid rgba(255,91,91,.25); }
    .btn-danger:hover { background: rgba(255,91,91,.25); }

    /* ── Form elements ───────────────────────── */
    .form-control, .form-select {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: border-color .15s;
    }
    .form-control:focus, .form-select:focus { border-color: var(--purple); }
    .form-control::placeholder { color: var(--text3); }
    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text2);
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: .4px;
    }
    .form-select option { background: var(--bg2); }

    /* ── Modal ───────────────────────────────── */
    .modal-content {
      background: var(--bg2) !important;
      border: 1px solid var(--border2) !important;
      border-radius: 16px !important;
    }
    .modal-header { border-color: var(--border) !important; }
    .modal-footer { border-color: var(--border) !important; }
    .modal-title { font-weight: 700 !important; }
    .btn-close-white { filter: invert(1) grayscale(1) brightness(2); }

    /* ── Grid utils ──────────────────────────── */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
    .grid-6-4 { display: grid; grid-template-columns: 6fr 4fr; gap: 20px; }
    .grid-3-7 { display: grid; grid-template-columns: 3fr 7fr; gap: 20px; }

    @media (max-width: 900px) {
      .grid-2,.grid-3,.grid-4,.grid-6-4,.grid-3-7 { grid-template-columns: 1fr; }
    }

    /* ── Spacing ─────────────────────────────── */
    .mt-16 { margin-top: 16px; }
    .mt-20 { margin-top: 20px; }
    .mb-16 { margin-bottom: 16px; }
    .mb-20 { margin-bottom: 20px; }
    .flex { display: flex; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .gap-8  { gap: 8px; }
    .gap-12 { gap: 12px; }
    .gap-16 { gap: 16px; }

    /* ── Scrollbar ───────────────────────────── */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }
  </style>
</head>
<body>

<!-- Sidebar -->
<nav class="sidebar">
  <div class="sidebar-logo">
    <div class="logo-row">
      <div class="logo-icon">🤖</div>
      <div>
        <div class="logo-text">Dev Agents</div>
        <div class="logo-sub">System v3.0</div>
      </div>
    </div>
  </div>

  <div class="sidebar-nav">
    <div class="nav-section-label">Головна</div>
    <a href="/" class="nav-link {% if request.endpoint == 'dashboard' %}active{% endif %}">
      <i class="fa fa-gauge-high"></i> Дашборд
    </a>

    <div class="nav-section-label">Агенти</div>
    <a href="/chat" class="nav-link {% if request.endpoint == 'chat_page' %}active{% endif %}" style="background: {% if request.endpoint == 'chat_page' %}var(--purple){% else %}rgba(124,111,255,.12){% endif %}; color: var(--purple)">
      <i class="fa fa-comments"></i> Чат з агентом
    </a>
    <a href="/agents" class="nav-link {% if request.endpoint == 'agents_page' %}active{% endif %}">
      <i class="fa fa-robot"></i> Всі агенти
    </a>
    <a href="/claude-md" class="nav-link {% if request.endpoint == 'claude_md_page' %}active{% endif %}">
      <i class="fa fa-file-code"></i> CLAUDE.md
    </a>

    <div class="nav-section-label">Якість</div>
    <a href="/bugs" class="nav-link {% if request.endpoint == 'bugs_page' %}active{% endif %}" id="nav-bugs">
      <i class="fa fa-bug"></i> Баги
      <span class="badge red" id="open-bug-count">…</span>
    </a>
    <a href="/lessons" class="nav-link {% if request.endpoint == 'lessons_page' %}active{% endif %}">
      <i class="fa fa-graduation-cap"></i> Уроки
    </a>

    <div class="nav-section-label">Дизайн</div>
    <a href="/design-rules" class="nav-link {% if request.endpoint == 'design_rules_page' %}active{% endif %}">
      <i class="fa fa-palette"></i> Design Rules
    </a>

    <div class="nav-section-label">Дані</div>
    <a href="/memory" class="nav-link {% if request.endpoint == 'memory_page' %}active{% endif %}">
      <i class="fa fa-brain"></i> Пам'ять
    </a>
    <a href="/reports" class="nav-link {% if request.endpoint == 'reports_page' %}active{% endif %}">
      <i class="fa fa-file-lines"></i> Звіти
    </a>
  </div>

  <div class="sidebar-footer">
    <div><span class="status-pulse"></span>Система активна</div>
    <div style="margin-top:5px; font-size:10px" id="last-update">…</div>
    <a href="/logout" style="display:block; margin-top:10px; font-size:11px; color:var(--text3); text-decoration:none; text-align:center; padding:6px; border-radius:6px; border:1px solid var(--border)">
      <i class="fa fa-right-from-bracket"></i> Вийти
    </a>
  </div>
</nav>

<!-- Main -->
<main class="main">
  {% block content %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
  // Live badge update
  async function refreshStats() {
    try {
      const r = await fetch('/api/stats');
      const d = await r.json();
      const el = document.getElementById('open-bug-count');
      if (el) {
        el.textContent = d.bugs_open;
        el.className = 'badge' + (d.bugs_open > 0 ? ' red' : '');
      }
      const lu = document.getElementById('last-update');
      if (lu) lu.textContent = d.last_updated;
    } catch(e) {}
  }
  refreshStats();
  setInterval(refreshStats, 30000);
</script>
{% block scripts %}{% endblock %}
</body>
</html>
