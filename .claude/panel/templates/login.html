<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Panel — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #080c14; --surface: #0d1421; --border: #1e2d45;
      --text: #d4e0f0; --text2: #7a92b0; --text3: #4a6280;
      --purple: #7c6fff; --red: #ff5b5b;
    }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 40px; width: 360px;
    }
    .logo { font-size: 32px; text-align: center; margin-bottom: 8px; }
    .title {
      text-align: center; font-size: 20px; font-weight: 700;
      color: var(--text); margin-bottom: 4px;
    }
    .subtitle {
      text-align: center; font-size: 13px; color: var(--text2);
      margin-bottom: 32px;
    }
    label { display: block; font-size: 12px; font-weight: 600; color: var(--text2);
            text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
    input[type="password"] {
      width: 100%; padding: 12px 16px; background: var(--bg);
      border: 1px solid var(--border); border-radius: 8px;
      color: var(--text); font-size: 14px; font-family: inherit;
      outline: none; transition: border-color 0.15s;
    }
    input[type="password"]:focus { border-color: var(--purple); }
    .error {
      background: rgba(255,91,91,.1); border: 1px solid rgba(255,91,91,.3);
      border-radius: 8px; padding: 10px 14px; font-size: 13px;
      color: var(--red); margin-bottom: 16px;
    }
    button {
      width: 100%; padding: 12px; background: var(--purple);
      border: none; border-radius: 8px; color: #fff;
      font-size: 14px; font-weight: 600; font-family: inherit;
      cursor: pointer; margin-top: 16px; transition: opacity 0.15s;
    }
    button:hover { opacity: 0.85; }
    .hint { text-align: center; font-size: 12px; color: var(--text3); margin-top: 20px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🤖</div>
    <div class="title">Agent Panel</div>
    <div class="subtitle">Multi-Agent Dev Platform v3.1</div>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">
      <label for="password">Пароль</label>
      <input type="password" id="password" name="password" placeholder="••••••••" autofocus>
      <button type="submit">Увійти →</button>
    </form>
    <div class="hint">Встановіть PANEL_PASSWORD в .env або залиште порожнім</div>
  </div>
</body>
</html>
